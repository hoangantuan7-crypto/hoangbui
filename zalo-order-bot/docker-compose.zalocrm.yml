# Chạy bot cùng ZaloCRM. Đặt thư mục zalo-order-bot vào trong thư mục ZaloCRM rồi chạy:
#   docker compose -f docker-compose.yml -f zalo-order-bot/docker-compose.zalocrm.yml up -d --build
services:
  order-bot:
    build: ./zalo-order-bot
    container_name: zalo-order-bot
    restart: unless-stopped
    environment:
      ZALOCRM_URL: http://app:3000
      ZALOCRM_API_KEY: ${ORDER_BOT_API_KEY}
      ZALOCRM_WEBHOOK_SECRET: ${ORDER_BOT_WEBHOOK_SECRET}
      ZALOCRM_REPORT_GROUP: ${ORDER_BOT_REPORT_GROUP:-Bot đơn hàng}
      ZALOCRM_ACCOUNT_ID: ${ORDER_BOT_ACCOUNT_ID:-}
      REPORT_TIMES: ${ORDER_BOT_REPORT_TIMES:-08:00,17:00}
      REMIND_MINUTES: ${ORDER_BOT_REMIND_MINUTES:-30}
      MEETING_TIME: ${ORDER_BOT_MEETING_TIME:-18:00}
      POLL_SECONDS: ${ORDER_BOT_POLL_SECONDS:-15}
      SCAN_GROUPS: ${ORDER_BOT_SCAN_GROUPS:-0}
      TELEGRAM_BOT_TOKEN: ${ORDER_BOT_TELEGRAM_TOKEN:-}
      TELEGRAM_TOKEN_SALE: ${ORDER_BOT_TELEGRAM_TOKEN_SALE:-}
      TELEGRAM_TOKEN_KETOAN: ${ORDER_BOT_TELEGRAM_TOKEN_KETOAN:-}
      TELEGRAM_TOKEN_KHO: ${ORDER_BOT_TELEGRAM_TOKEN_KHO:-}
      TELEGRAM_TOKEN_KYTHUAT: ${ORDER_BOT_TELEGRAM_TOKEN_KYTHUAT:-}
      PAIR_CODE: ${ORDER_BOT_PAIR_CODE:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - order_bot_data:/data
    depends_on:
      - app

volumes:
  order_bot_data:
